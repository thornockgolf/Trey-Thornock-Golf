<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#0B4F3A" />
		<title>Offline | Trey Thornock Golf</title>
		<!-- Static and user-agnostic: shown by the service worker when a page cannot load. No data, no scripts from the app. -->
		<style>
			:root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --text: #333; --head: #0e2b5c; --muted: #4c5c56; --line: #e8e8e8; --green: #0b4f3a; }
			@media (prefers-color-scheme: dark) { :root { --bg: #0e1311; --card: #171d1a; --text: #f6f6f4; --head: #d4d9e2; --muted: #a3aaa6; --line: #333; --green: #417665; } }
			* { box-sizing: border-box; }
			body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
			main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; text-align: center; }
			img { width: 64px; height: 64px; border-radius: 12px; background: #fff; }
			h1 { margin: 16px 0 8px; font-size: 24px; color: var(--head); }
			p { margin: 0 0 20px; color: var(--muted); }
			button { font: inherit; font-weight: 600; padding: 12px 28px; border: 0; border-radius: 999px; background: var(--green); color: #fff; cursor: pointer; }
			button:focus-visible { outline: 3px solid #d4a017; outline-offset: 3px; }
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" width="64" height="64" />
			<h1>You're offline</h1>
			<p>Trey Thornock Golf needs a connection to load this page. Your videos and messages will be here when you're back online.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
		<script>
			addEventListener('online', function () { location.reload(); });
		</script>
	</body>
</html>
