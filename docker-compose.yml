# Local development services. The VPS runs the real self-hosted Supabase via Coolify.
# `docker compose up -d db` starts Postgres; the app and worker run on the host with Bun.
services:
  db:
    # Matches the VPS self-hosted Supabase (checked 2026-10-12). Re-check against the VPS stack
    # when Supabase is upgraded; override with POSTGRES_IMAGE.
    image: ${POSTGRES_IMAGE:-supabase/postgres:15.8.1.085}
    container_name: ttg-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54322}:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - ttg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h localhost']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ttg-db-data:
