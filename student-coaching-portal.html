function persist(){try{localStorage.setItem('tt-student-v2',JSON.stringify(state));return true}catch{notify('Browser storage is unavailable. Changes will last for this visit only.');return false}}function notify(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(window.toaster);window.toaster=setTimeout(()=>$('#toast').hidden=true,4200)}function dateText(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function go(p){if(p==='development'){journeyTab='roadmap';p='progress'}page=p;render();window.scrollTo(0,0)}function btn(label,action,kind=''){return `<button class="btn ${kind}" onclick="${action}">${label}</button>`}function header(kicker,title,copy,action=''){return `<div class="head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="muted">${copy}</p></div>${action}</div>`}function modal(html){$('#modal').innerHTML=`<button class="close" aria-label="Close dialog" onclick="closeModal()">×</button>${html}`;$('#modal').showModal()}function closeModal(){$('#modal').close()}function accessLocked(title,copy){return `<div class="empty"><span class="tag gold">Not included in your current access</span><h2 style="margin-top:18px">${title}</h2><p>${copy}</p>${btn('Explore access',"purchase()")}</div>`}function purchase(){modal(`<h2>Find the right next step</h2><p class="muted">Discuss your goals with Trey to find the right service for your game.</p><div class="access">Prototype preview: pricing and checkout will be connected in the final product. No purchase is made here.</div><div class="actions section">${btn('Ask about a service',"closeModal();go('chat')")}${btn('Preview access settings',"closeModal();settings()",'outline')}</div>`)}
function render(){$('.nav').innerHTML=Object.entries(names).map(([k,v],i)=>`<button ${k===page?'aria-current="page"':''} class="${k===page?'active':''}" onclick="go('${k}')"><span>${icons[i]}</span>${v}</button>`).join('');$('#crumb').textContent=names[page]||({more:'More',session:'Practice in progress'}[page]);$('#app').innerHTML=({overview,development,practice,progress,videos,chat,more,sessionView}[page==='session'?'sessionView':page])();$('#bottomNav').innerHTML=[['overview','Home'],['practice','Practice'],['log','＋ Log'],['chat','Coach'],['more','More']].map(([key,label])=>`<button class="${(key===page||(key==='practice'&&page==='session'))?'active':''}" onclick="${key==='log'?'logMenu()':"go('"+key+"')"}">${label}</button>`).join('');if(page==='chat'){if(pendingContext&&!Array.from($('#context').options).some(x=>x.value===pendingContext))$('#context').add(new Option(pendingContext,pendingContext));$('#context').value=pendingContext||state.chatDraft?.context||'';$('#message').value=state.chatDraft?.text||''}}
function overview(){return header('MY PLAYER SPACE','Ready when you are, Jordan.','')+`<div class="grid"><div class="feature"><span class="eyebrow">TODAY’S PRACTICE · ASSIGNED BY TREY</span><h2>Wedge ladder</h2><p>35 minutes · Practice range</p><div class="note">Repeat your stock swing and track carry distance.</div>${btn(state.session?'Resume practice →':'Start practice →',"plan(state.session?.index??0)",'light wide')}</div><div class="card"><h2>Capture your game</h2><div class="stack">${btn('Log round',"logForm('Round')",'outline wide')}${btn('Add video',"upload()",'outline wide')}${btn('Log practice',"logForm('Practice')",'outline wide')}</div></div></div>${Object.keys(state.drafts||{}).length?'<div class="access section">You have an unfinished log. Open Log to pick up where you left off.</div>':''}<div class="card section"><span class="eyebrow">LATEST FROM TREY · SAMPLE FEEDBACK</span><h2 style="margin-top:12px">Keep the same target routine.</h2><p>Your carry control is improving. Send a face-on wedge video after your next session.</p>${btn('Reply to Trey',"askCoach('Practice: Wedge ladder')",'outline')}</div><div class="actions section">${btn('View my journey',"go('progress')",'outline')}</div>`}
function roadmapContent(){return `<div class="grid"><div class="card"><div class="row"><h2>Your development roadmap</h2><span class="tag">Coach-created</span></div>${state.access.roadmap?`<p class="muted">90-day development · Goal: break 90 consistently</p><div class="phase"><span class="tag">Complete</span><h3>01 · Understand your game</h3><p>Review your scoring patterns, goals, and starting skills.</p></div><div class="phase current"><span class="tag">Current phase</span><h3>02 · Build reliable foundations</h3><p>Develop stock wedge distances and a repeatable practice routine.</p><p><b>Ready to progress:</b> demonstrate carry control across two logged wedge sessions, then review with Trey.</p>${btn('View assigned practice',"go('practice')",'outline small')}</div><div class="phase"><h3>03 · Develop scoring skills</h3><p>Build putting pace and sharpen decisions inside 100 yards.</p></div><div class="phase"><h3>04 · Transfer & review</h3><p>Use your routines on the course, compare results, and set the next priorities.</p></div><div class="access"><b>Next checkpoint: Foundation review</b><br>Trey reviews your practice results, rounds, and videos before adjusting your roadmap.</div>`:accessLocked('A plan built around your game','Your personalized roadmap appears here when it is included in your coaching service.')}</div><div class="stack"><div class="card"><div class="row"><h2>Golf assessment</h2><span class="tag ${state.access.assessment?'':'gold'}">${state.access.assessment?'Purchased':'Optional service'}</span></div>${state.access.assessment?`<p class="helper">Coach-reviewed · September 1 · Sample results</p><h3>Your scoring opportunity</h3><p class="muted">Distance control inside 100 yards. Build predictable carries before adding more shot variety.</p><div class="list-item"><h3>Build on this strength</h3><p>Your tee-shot routine and willingness to choose a safer target.</p></div><div class="list-item"><h3>Development priorities</h3><p>1. Wedge distance control<br>2. Putting speed<br>3. On-course decisions</p></div><div class="section">${btn('View full results',"assessment()",'outline')}</div>`:accessLocked('Know where to focus','Purchase a golf assessment to see your results and Trey’s interpretation here.')}</div><div class="card"><h3>Your coaching plan</h3><p class="muted">Your roadmap is adjusted by Trey as your game develops. Completing a drill does not automatically move you to the next phase.</p>${btn('Ask about my development',"go('chat')",'outline')}</div></div></div>`}
function assessment(){modal(`<div class="eyebrow">SAMPLE COACH-REVIEWED ASSESSMENT</div><h2 style="margin-top:10px">Your game at a glance</h2><p class="muted">September 1 · Jordan Davis</p><h3>Measured starting points</h3><div class="list-item row"><span>Wedge target test</span><b>6 / 15 within 5 yards</b></div><div class="list-item row"><span>Lag-putting target test</span><b>5 / 10 inside 3 feet</b></div><h3 class="section">Your confidence · self-reported</h3><p>Driving: 3 / 5 · Wedges: 2 / 5 · Putting: 3 / 5</p><h3>Trey’s interpretation</h3><p class="muted">Your wedge test and confidence rating point to the same priority. We’ll establish reliable carry distances and use round notes to see where that work transfers.</p><p class="helper">These are illustrative assessment results, not an automated diagnosis.</p>${btn('See assigned practice',"closeModal();go('practice')")}`)}
const plans=[{title:'Wedge ladder',minutes:35,place:'Practice range',focus:'Wedge distance control',target:'9 of 15 shots within 5 yards of the intended carry distance.',steps:['Warm up for 5 minutes with comfortable half swings.','Choose targets at 40, 55, 70, 85, and 100 yards. Hit 3 balls to each target.','Record each carry and count shots finishing within 5 yards of the target.','Change targets between shots for your final 10 minutes. Use your full routine.']},{title:'Putting pace ladder',minutes:25,place:'Putting green',focus:'Putting speed control',target:'7 of 10 putts finish within 3 feet.',steps:['Warm up by rolling putts to the edge of the green.','Alternate putts from 20, 30, and 40 feet using your normal routine.','Score 10 putts. Count those finishing within 3 feet.','Repeat your hardest distance, then record what changed.']}];
function practice(){return header('PRACTICE WITH PURPOSE','My practice','Build your next session. Keep moving toward your goal.')+(state.access.generator?`<div class="card generator-workspace"><div class="row"><h2>Practice plan generator</h2><span class="tag">Subscription active</span></div><p class="muted">Choose your time and location. Get a session connected to your current focus.</p><form onsubmit="generate(event)"><div class="two"><div class="field"><label for="genTime">Time available</label><select id="genTime"><option value="20">20 minutes</option><option value="35" selected>35 minutes</option><option value="50">50 minutes</option></select></div><div class="field"><label for="genPlace">Where will you practice?</label><select id="genPlace"><option>Practice range</option><option>Putting green</option><option>At home</option></select></div></div><p class="helper">Current focus: wedge distance control</p><button class="btn">Generate my practice →</button></form><div id="generated">${generated?generatedHTML():''}</div></div>`:`<div class="feature generator-offer"><span class="eyebrow">PRACTICE PLAN GENERATOR · SUBSCRIPTION</span><h2>Know what to practice.<br>Make your time count.</h2><p>Turn your available time into a focused session built around your development priorities.</p><div class="generator-benefits"><span>20, 35, or 50 minutes</span><span>Range, green, or home</span><span>Clear steps and measurable targets</span></div><div class="actions">${btn('Unlock the practice generator',"subscribeGenerator()",'light')}${btn('See a sample session',"generatorExample()",'outline')}</div><p class="offer-note">Your coach-assigned practices remain available below.</p></div>`)+`<div class="assigned-heading"><h2>Assigned by Trey</h2><p class="muted">Your coach’s priorities for your current development phase.</p></div><div class="stack">${plans.map((p,i)=>`<div class="card"><div class="row"><span class="tag">Assigned by Trey</span><span class="status">${i===0?'Current priority':'Supporting skill'}</span></div><h2 style="margin-top:16px">${p.title}</h2><p class="muted">${p.minutes} minutes · ${p.place}</p><p>${p.target}</p><div class="actions">${btn(state.session?.index===i?'Resume practice':'Open practice',`plan(${i})`)}${btn('Log results',`logForm('Practice','${p.title}')`,'outline')}</div></div>`).join('')}</div>`}
function plan(i){if(!state.session||state.session.index!==i){state.session={index:i,step:0,hits:0};persist()}page='session';render();window.scrollTo(0,0)}
function generate(e){e.preventDefault();let time=Number($('#genTime').value),place=$('#genPlace').value;generated={time,place,title:place==='Practice range'?'Wedge carry control':place==='Putting green'?'Putting pace session':'Wedge routine rehearsal',steps:place==='Practice range'?[`Warm up · 5 minutes`,`Alternate 40, 60, and 80-yard targets · ${time-10} minutes`,'Finish with 6 scored shots · 5 minutes. Record how many carry within 5 yards of the target.']:place==='Putting green'?['Warm up your pace · 5 minutes',`Alternate 20 and 30-foot putts · ${time-10} minutes`,'Finish with 6 scored putts · 5 minutes. Count those inside 3 feet.']:['Set up a safe space without hitting balls · 5 minutes',`Rehearse your setup and pre-shot routine · ${time-10} minutes`,'Reflect on consistency · 5 minutes. Note one cue to take to the range.']};$('#generated').innerHTML=generatedHTML()}

function originalLogMenu(){modal(`<h2>What would you like to log?</h2><p class="muted">Capture the work and the results.</p><div class="actions">${btn('Practice session',"closeModal();logForm('Practice')")}${btn('Round of golf',"closeModal();logForm('Round')",'outline')}</div>`)}
function logForm(type,focus='',editId=''){const draftKey=editId||type+':'+focus;const original=state.logs.find(x=>x.id===editId);const p=plans.find(x=>x.title===focus);const d=state.drafts?.[draftKey]||original||{date:today(),focus,minutes:p?.minutes||(generated?.title===focus?generated.time:35),course:state.lastCourse||'',holes:18,result:focus===plans[state.session?.index]?.title&&state.session?state.session.hits+' / '+(state.session.index===0?15:10)+' inside target':''};activeDraft={key:draftKey,type,editId};modal(`<h2>${editId?'Edit': 'Log'} ${type==='Round'?'round':'practice'}</h2><p class="helper" id="draftStatus">Your draft saves on this browser as you type.</p><form id="logForm" oninput="saveDraft(this)" onchange="saveDraft(this)" onsubmit="saveLog(event,'${type}')"><div class="two"><div class="field"><label for="logDate">Date</label><input id="logDate" name="date" type="date" required value="${esc(d.date)}" max="${today()}"></div>${type==='Practice'?`<div class="field"><label for="mins">Minutes</label><input id="mins" name="minutes" type="number" inputmode="numeric" min="1" max="600" required value="${esc(d.minutes)}"></div><div class="field full"><label for="focus">Session</label><input id="focus" name="focus" maxlength="150" required value="${esc(d.focus)}"></div><div class="field full"><label for="result">Result (optional)</label><input id="result" name="result" maxlength="250" value="${esc(d.result||'')}" placeholder="e.g. 9 of 15 inside target"></div>`:`<div class="field"><label for="holes">Holes</label><select name="holes" id="holes"><option value="18" ${Number(d.holes)===18?'selected':''}>18 holes</option><option value="9" ${Number(d.holes)===9?'selected':''}>9 holes</option></select></div><div class="field"><label for="course">Course</label><input name="course" id="course" required maxlength="150" value="${esc(d.course)}" autocomplete="off"></div><div class="field"><label for="score">Score</label><input name="score" id="score" type="number" inputmode="numeric" min="18" max="250" required value="${esc(d.score||'')}"></div>`}</div><details ${d.note||d.putts||d.penalties?'open':''}><summary>Add details (optional)</summary>${type==='Round'?`<div class="two"><div class="field"><label for="putts">Putts</label><input name="putts" id="putts" type="number" inputmode="numeric" min="0" max="100" value="${esc(d.putts??'')}"></div><div class="field"><label for="penalties">Penalty strokes</label><input name="penalties" id="penalties" type="number" inputmode="numeric" min="0" max="50" value="${esc(d.penalties??'')}"></div></div>`:''}<div class="field"><label for="note">One thing you noticed</label><textarea id="note" name="note" maxlength="2000">${esc(d.note||'')}</textarea></div></details><div class="form-footer"><button class="btn wide">${editId?'Save changes':'Save '+type.toLowerCase()}</button></div></form>`)}

function saveLog(e,type){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));for(let k of ['score','holes','minutes','putts','penalties'])if(x[k]!==undefined&&x[k]!=='')x[k]=Number(x[k]);x.type=type;x.id=activeDraft?.editId||crypto.randomUUID();let i=state.logs.findIndex(y=>y.id===x.id);if(i<0)state.logs.push(x);else state.logs[i]=x;if(type==='Round')state.lastCourse=x.course;if(activeDraft)delete state.drafts[activeDraft.key];if(type==='Practice'&&state.session&&plans[state.session.index].title===x.focus)state.session=null;let saved=persist();activeDraft=null;closeModal();page='progress';journeyTab='results';progressTab=type==='Round'?'rounds':'practice';render();if(saved)notify('Saved on this browser. No coach sync in this prototype.')}
function journalContent(){const rs=state.logs.filter(x=>x.type==='Round'&&x.holes===18).sort((a,b)=>a.date.localeCompare(b.date)),ps=state.logs.filter(x=>x.type==='Practice'),avg=rs.length?(rs.reduce((s,x)=>s+x.score,0)/rs.length).toFixed(1):'—',logs=state.logs.filter(x=>x.type===(progressTab==='rounds'?'Round':'Practice')).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="grid"><div class="card"><div class="row"><h2>Recent scoring</h2><span class="helper">18-hole rounds only</span></div>${rs.length?`<div class="chart" role="img" aria-label="Recent 18-hole scores: ${rs.slice(-6).map(x=>x.score).join(', ')}">${rs.slice(-6).map(x=>`<div class="chart-col" style="height:${Math.max(8,x.score/Math.max(...rs.slice(-6).map(x=>x.score))*100)}%"><strong>${x.score}</strong><small>${dateText(x.date)}</small></div>`).join('')}</div><p class="helper" style="margin:16px 0 0">Most recent ${Math.min(6,rs.length)} logged rounds. Lower scores are better. Course difficulty is not adjusted.</p>`:'<p class="muted">Log an 18-hole round to begin your scoring chart.</p>'}</div><div class="card"><div class="list-item row"><span>18-hole scoring average</span><strong>${avg}</strong></div><div class="list-item row"><span>Practice sessions</span><strong>${ps.length}</strong></div><div class="list-item row"><span>Total practice time</span><strong>${ps.reduce((s,x)=>s+x.minutes,0)} min</strong></div><p class="helper section">9-hole rounds remain in your journal and are excluded from the 18-hole average. A score alone does not establish a handicap.</p></div></div><div class="card section"><div class="tabs"><button class="${progressTab==='rounds'?'active':''}" onclick="progressTab='rounds';render()">Rounds</button><button class="${progressTab==='practice'?'active':''}" onclick="progressTab='practice';render()">Practice journal</button></div><div class="journal-list">${logs.map(x=>`<details class="journal-entry"><summary><b>${x.type==='Round'?x.score+' · '+x.holes+' holes':esc(x.focus)}</b><span>${dateText(x.date)} · ${x.type==='Round'?esc(x.course):x.minutes+' min'}</span><small>View details / edit</small></summary><p>${esc(x.result||'')}</p><p>${esc(x.note||'No reflection added.')}</p>${x.putts!==undefined&&x.putts!==''?'<p>Putts: '+x.putts+'</p>':''}${x.penalties!==undefined&&x.penalties!==''?'<p>Penalties: '+x.penalties+'</p>':''}<div class="actions">${btn('Edit entry',"logForm('"+x.type+"','','"+x.id+"')",'outline')}${btn('Ask Trey',"askLog('"+x.id+"')",'outline')}</div></details>`).join('')||'<p>No entries yet. Log your first session above.</p>'}</div></div>`}
function videos(){return header('YOUR SWING LIBRARY','My videos','Keep your swings organized and your coach’s feedback close.',btn('Add a video',"upload()"))+`<p class="helper">Preview mode: videos play during this visit. Files are not uploaded to Trey; only their details are saved on this browser.</p><div class="video-grid">${state.videos.map(v=>`<div class="card">${urls[v.id]?`<video class="video" controls src="${urls[v.id]}"></video>`:`<div class="empty"><b>Video file not attached this visit</b><p>${esc(v.name)}</p><p class="helper">Add the video again to preview playback.</p></div>`}<div class="row section"><h3>${esc(v.club)} · ${esc(v.angle)}</h3><span class="tag gold">Local preview</span></div><p class="helper">${dateText(v.date)} · ${esc(v.name)}</p><p>${esc(v.note||'No notes added.')}</p><p class="helper">Not sent for coach review.</p></div>`).join('')}<div class="card"><span class="tag">Coach feedback · Sample</span><h2 style="margin-top:18px">Wedge · Face-on</h2><p class="helper">September 22 · Sample review</p><h3>Trey’s feedback</h3><p class="muted">Your finish looks more balanced. Keep the same length of backswing and track the carry, rather than trying to add speed.</p><div class="access"><b>Next video request</b><br>Film three stock wedge swings face-on, with your whole body and club visible.</div><div class="section">${btn('Discuss this feedback',"askCoach('Video: Wedge · Face-on · Sample review')",'outline')}</div></div></div>`}
function upload(){selectedVideo=null;modal(`<h2>Add a swing video</h2><p class="helper">Choose a file or use your phone camera. Local preview only; nothing is sent to Trey.</p><form onsubmit="saveVideo(event)"><div class="two"><label class="btn outline">Record video<input class="file-choice" type="file" accept="video/*" capture="environment" onchange="selectVideo(this)"></label><label class="btn outline">Choose existing<input class="file-choice" type="file" accept="video/*" onchange="selectVideo(this)"></label></div><p id="fileStatus" class="helper" role="status">No video selected · Up to 100 MB</p><div class="two"><div class="field"><label for="club">Club</label><select name="club" id="club">${['Driver','Fairway wood','Hybrid','Long iron','Mid iron','Short iron','Wedge','Putter'].map(c=>'<option '+(c===state.lastClub?'selected':'')+'>'+c+'</option>').join('')}</select></div><div class="field"><label for="angle">Camera angle</label><select id="angle" name="angle"><option>Face-on</option><option>Down the line</option><option>Other</option></select></div></div><div class="field"><label for="videoNote">What should Trey look at? (optional)</label><textarea id="videoNote" name="note" maxlength="2000"></textarea></div><button class="btn wide">Add to local preview</button></form>`)}

function saveVideo(e){e.preventDefault();let f=selectedVideo;if(!f){notify('Choose or record a video first.');return}let v={...Object.fromEntries(new FormData(e.target)),id:crypto.randomUUID(),name:f.name,date:today()};urls[v.id]=URL.createObjectURL(f);state.videos.unshift(v);state.lastClub=v.club;persist();closeModal();go('videos');notify('Video ready to preview. Not sent to Trey.')}
function chat(){return header('STAY CONNECTED','Coach chat','Keep your questions and coaching feedback together.')+`<div class="card chat"><div class="row" style="padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px"><div class="student"><div class="avatar">TT</div><b>Trey Thornock</b></div><span class="tag">Your coach</span></div><div class="messages"><div class="bubble"><small>Trey · Sample message · Sep 22</small><p>Your carry control is improving. Stick with the wedge ladder for your next session. Send me a face-on wedge video when you can.</p><button class="link" onclick="plan(0)">View assigned wedge ladder</button></div><div class="bubble mine"><small>Jordan · Sample message · Sep 22</small><p>The 70-yard target felt much more repeatable. I’ll record a few swings next time.</p></div>${state.messages.map(m=>`<div class="bubble mine"><small>Jordan · ${dateText(m.date)} · Local demo</small>${m.context?`<div class="tag">${esc(m.context)}</div>`:''}<p style="white-space:pre-wrap">${esc(m.text)}</p></div>`).join('')}</div><div class="actions" style="margin-bottom:20px">${btn('Add video',"upload()",'outline')}${btn('Video library',"go('videos')",'outline')}</div><form oninput="saveChatDraft(this)" onchange="saveChatDraft(this)" onsubmit="sendMessage(event)"><div class="field"><label for="context">Reference (optional)</label><select id="context" name="context"><option value="">General question</option><option>Practice: Wedge ladder</option><option>Practice: Putting pace ladder</option>${state.logs.filter(x=>x.type==='Round').map(x=>`<option>${esc('Round: '+x.course+' · '+x.date+' · '+x.score)}</option>`).join('')}${state.videos.map(v=>`<option>${esc('Video: '+v.club+' · '+v.angle+' · '+v.date)}</option>`).join('')}</select></div><div class="field"><label for="message">Your message to Trey</label><textarea id="message" name="text" required maxlength="4000" placeholder="Ask a question or share what you noticed…"></textarea></div><div class="row"><s function sendMessage(e){e.preventDefault();let m=Object.fromEntries(new FormData(e.target));if(!m.text.trim())return;state.messages.push({...m,date:today()});state.chatDraft=null;pendingContext="";persist();render();$('.messages').scrollTop=$('.messages').scrollHeight;notify('Demo message added. Nothing was sent to Trey.')}
function settings(){modal(`<h2>Preview student access</h2><p class="muted">Use these controls to review what different students would see. They simulate purchases; they do not process payments.</p><form onsubmit="saveAccess(event)">${[['assessment','Golf assessment purchased'],['roadmap','Personalized roadmap included'],['generator','Practice generator subscription active']].map(([k,l])=>`<label class="check"><input name="${k}" type="checkbox" ${state.access[k]?'checked':''}>${l}</label>`).join('')}<div class="access">Coach-assigned practice remains available in this example. Actual service entitlements should be configured by your coaching business.</div><div class="section"><button class="btn">Apply preview access</button></div></form>`)}function saveAccess(e){e.preventDefault();let f=new FormData(e.target);for(let k of Object.keys(state.access))state.access[k]=f.has(k);persist();closeModal();render();notify('Student access preview updated.')}
function logMenu(){modal('<h2>Log your activity</h2><div class="actions">'+btn('Practice',"closeModal();logForm('Practice')")+btn('Round',"closeModal();logForm('Round')",'outline')+'</div>'+ (Object.keys(state.drafts).length?'<h3 class="section">Continue a draft</h3><div class="stack">'+Object.entries(state.drafts).map(([key,d],i)=>btn(esc(d.focus||d.course||'Unfinished log'),"resumeDraft("+i+")",'outline')).join('')+'</div>':''))}
function resumeDraft(i){const key=Object.keys(state.drafts)[i];const existing=state.logs.find(x=>x.id===key);closeModal();if(existing)logForm(existing.type,'',key);else {const split=key.indexOf(':');logForm(key.slice(0,split),key.slice(split+1))}}
let activeDraft=null,pendingContext='',selectedVideo=null;
state.drafts ||= {};state.logs.forEach((x,i)=>x.id ||= 'entry-'+i);
function more(){return header('YOUR PLAYER SPACE','More','Your development and history, all in one place.')+`<div class="stack">${[['progress','My journey','Your roadmap, assessment, scoring trends, and journal'],['videos','My video library','Club-by-club swings and coach feedback']].map(([key,title,copy])=>`<button class="card menu-card" onclick="go('${key}')"><b>${title} →</b><span>${copy}</span></button>`).join('')}</div>`}
function sessionView(){if(!state.session)return practice();const s=state.session,p=plans[s.index],max=s.index===0?15:10;return header('ASSIGNED BY TREY',p.title,`${p.minutes} minutes · Step ${s.step+1} of ${p.steps.length}`)+`<div class="card session-card"><div class="bar"><i style="width:${(s.step+1)/p.steps.length*100}%"></i></div><h2>${['Get ready','Work the drill','Measure your result','Finish with intention'][s.step]}</h2><p class="drill-copy">${p.steps[s.step]}</p><div class="access"><b>Your target</b><p>${p.target}</p><span class="helper">Record the scored test only: ${max} attempts.</span><div class="counter"><button class="btn outline" aria-label="One fewer successful shot" onclick="countHit(-1)" ${s.hits===0?'disabled':''}>−</button><strong aria-live="polite">${s.hits} / ${max}</strong><button class="btn outline" aria-label="One more successful shot" onclick="countHit(1)" ${s.hits===max?'disabled':''}>＋</button></div></div><div class="actions section">${s.step?btn('Previous',"stepPractice(-1)",'outline'):''}${s.step<p.steps.length-1?btn('Next drill →',"stepPractice(1)"):btn('Finish & log practice',`logForm('Practice','${p.title}')`)}</div><div class="actions section">${btn('Save & leave',"go('practice')",'outline')}${btn('Ask Trey',`askCoach('Practice: ${p.title}')`,'outline')}</div><p class="helper section">Step and score saved on this browser. Resume from Home or My Practice.</p></div>`}
function stepPractice(n){state.session.step=Math.max(0,Math.min(3,state.session.step+n));persist();render();window.scrollTo(0,0)}
function countHit(n){state.session.hits=Math.max(0,Math.min(state.session.index===0?15:10,state.session.hits+n));persist();render()}
function saveDraft(form){if(!activeDraft)return;state.drafts[activeDraft.key]=Object.fromEntries(new FormData(form));const saved=persist();$('#draftStatus').textContent=saved?'Draft saved on this browser.':'Draft could not be saved. Keep this page open.'}
function saveChatDraft(form){state.chatDraft=Object.fromEntries(new FormData(form));persist()}
function askCoach(context){pendingContext=context;go('chat');$('#message').focus()}
function askLog(id){const x=state.logs.find(x=>x.id===id);askCoach(x.type+': '+(x.course||x.focus)+' · '+x.date)}
function selectVideo(input){const f=input.files[0];selectedVideo=null;if(!f)return;if(!f.type.startsWith('video/')&&!/\.(mp4|mov|webm|m4v)$/i.test(f.name)){notify('Choose a video file.');input.value='';return}if(f.size>100*1024*1024){notify('Choose a video smaller than 100 MB.');input.value='';return}selectedVideo=f;$('#fileStatus').textContent=f.name+' · Ready for local preview'}

let journeyTab='roadmap';
function development(){return progress()}
function progress(){return header('YOUR DEVELOPMENT','My journey','Your plan and your progress, together.',btn('Log activity',"logMenu()",'outline'))+`<div class="tabs journey-tabs" aria-label="Journey views"><button class="${journeyTab==='roadmap'?'active':''}" aria-pressed="${journeyTab==='roadmap'}" onclick="journeyTab='roadmap';render()">Roadmap & assessment</button><button class="${journeyTab==='results'?'active':''}" aria-pressed="${journeyTab==='results'}" onclick="journeyTab='results';render()">Results & journal</button></div>`+(journeyTab==='roadmap'?roadmapContent():journalContent())}
function subscribeGenerator(){modal(`<span class="tag gold">PRACTICE PLAN GENERATOR</span><h2 style="margin-top:16px">Make purposeful practice a habit.</h2><p>Build a session for your time, location, and current development focus.</p><ul><li>Choose a 20, 35, or 50-minute session.</li><li>Practice at the range, on the putting green, or at home.</li><li>Get clear steps and a result to track.</li></ul><div class="access">Subscription pricing and checkout are not connected in this prototype. No charge will be made.</div><div class="actions section">${btn('Ask Trey about subscribing',"closeModal();askCoach('Practice generator subscription')")}${btn('Preview subscriber access',"closeModal();settings()",'outline')}</div>`)}
function generatorExample(){modal(`<span class="tag">Sample session · Not personalized</span><h2 style="margin-top:16px">35 minutes. One clear purpose.</h2><p>Wedge carry control · Practice range</p><ol><li>Warm up for 5 minutes.</li><li>Alternate 40, 60, and 80-yard targets for 25 minutes.</li><li>Finish with 6 scored shots over 5 minutes. Count shots within 5 yards of the target.</li></ol><p class="helper">The generator adapts the session to your available time and practice location. Coach-assigned plans stay available separately.</p>${btn('Unlock the generator',"closeModal();subscribeGenerator()") }`)}

render();
</script></body></html>
